name: PATCHWORK Automated Release & Governance Gate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      website_id:
        description: 'Website ID to deploy active release bundle to'
        required: true
        default: 'demo-store'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verification-and-release:
    name: Verify, Bundle & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci || npm install

      - name: Run Full Monorepo Typecheck Gate
        run: npm run typecheck

      - name: Compile All Packages
        run: |
          npm run build --workspace=packages/contracts
          npm run build --workspace=packages/verification
          npm run build --workspace=packages/server
          npm run build --workspace=packages/runtime
          npm run build --workspace=packages/dashboard

      - name: Package Release Bundle Artifact
        id: bundle
        run: |
          mkdir -p release-artifacts
          RELEASE_TAG="${GITHUB_REF_NAME:-v0.1.0}"
          cat <<EOF > release-artifacts/release-manifest.json
          {
            "releaseTag": "$RELEASE_TAG",
            "websiteId": "${{ github.event.inputs.website_id || 'demo-store' }}",
            "environment": "${{ github.event.inputs.target_env || 'production' }}",
            "commitSha": "$GITHUB_SHA",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "governanceGate": "PASSED",
            "typecheckStatus": "PASSED"
          }
          EOF
          tar -czf release-artifacts/patchwork-dist.tar.gz packages/*/dist

      - name: Create GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "PATCHWORK Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/release-manifest.json
            release-artifacts/patchwork-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
